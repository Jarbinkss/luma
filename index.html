<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luma — Photo Editor</title>
<style>
:root{color-scheme:dark;--bg:#111315;--panel:#1b1f22;--line:#343b40;--ink:#f4f1eb;--muted:#abb3b6;--accent:#d9bd9b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,.upload{border:0;border-radius:8px;padding:10px 13px;background:var(--accent);color:#171513;font:600 13px inherit;cursor:pointer}button{font-size:13px;font-weight:700}.secondary{background:#343b40;color:var(--ink)}.tag{font-size:11px;color:var(--muted);font-weight:400;border:1px solid var(--line);padding:3px 7px;border-radius:12px}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.topbar{height:62px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:750;margin-right:auto}.layout{display:grid;grid-template-columns:265px minmax(0,1fr) 205px;min-height:0;flex:1}.adjustments,.looks{overflow:auto;min-height:0;background:var(--panel);padding:14px;border-right:1px solid var(--line)}.looks{border-right:0;border-left:1px solid var(--line)}.side-title{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin-bottom:8px}.side-title button{padding:6px 10px}.panel{border-top:1px solid var(--line);padding:15px 0}.panel h2,.looks h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px;color:#ddd}.controls{display:block}.control{padding:7px 0}label{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px}output{color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--accent)}.styles{display:flex;flex-direction:column;gap:8px}.style-btn{text-align:left;background:#2b3033;color:var(--ink);padding:13px 12px;border:1px solid #42494d}.style-btn.active{border-color:var(--accent);background:#554838;color:#fff}.style-description{font-size:12px;color:var(--muted);line-height:1.5;margin-top:15px}.viewer{min-width:0;min-height:0;display:flex;flex-direction:column;background:#101112}.viewer-head,.viewer-foot{display:flex;align-items:center;gap:8px;padding:9px 15px;color:var(--muted);font-size:12px}.viewer-head{justify-content:space-between}.viewer-foot button{padding:6px 12px;font-size:15px}.image-viewport{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:zoom-in}.image-viewport.zoomed{cursor:grab}.image-viewport.dragging{cursor:grabbing}.image-transform{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-origin:center center;will-change:transform}.image-transform img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}.status{min-height:24px;padding:0 15px 7px;color:var(--muted);font-size:11px}.source-hidden{display:none}[hidden]{display:none!important}
@media(max-width:800px){.app{height:100dvh}.topbar{height:54px;padding:0 10px;gap:7px}.brand{font-size:20px}.layout{display:flex;flex-direction:column}.viewer{order:0;flex:0 0 48dvh}.looks{order:1;overflow:visible;padding:10px;border:0;border-top:1px solid var(--line)}.looks h2{margin-bottom:7px}.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.style-btn{text-align:center;padding:10px 3px;font-size:11px}.style-description{display:none}.adjustments{order:2;flex:1;overflow:auto;padding:10px;border:0;border-top:1px solid var(--line)}.panel{padding:10px 0}.viewer-head{padding:5px 10px}.viewer-foot{padding:5px 10px}.viewer-foot span{font-size:10px}.status{font-size:10px;padding:0 10px 3px}.side-title{position:sticky;top:-10px;background:var(--panel);padding:8px 0;z-index:2}}
@media(max-width:420px){.styles{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer{flex-basis:44dvh}.brand .tag{display:none}}
</style>
<style>
/* Luma phone workspace: fixed image, translucent controls, swipeable tools */
@media(max-width:800px){
 html,body{height:100%;overflow:hidden}
 .app{height:100dvh;overflow:hidden}
 .layout{position:relative;display:block;flex:1;min-height:0;overflow:hidden}
 .viewer{position:absolute;inset:0 0 74px;display:flex;flex-direction:column;background:#101112}
 .image-viewport{flex:1;min-height:0}
 .viewer-head{flex-shrink:0}
 .viewer-foot{flex-shrink:0}
 .looks,.adjustments{position:absolute;z-index:8;left:12px;right:12px;bottom:86px;top:auto;
  max-height:min(46dvh,390px);overflow-y:auto;overscroll-behavior:contain;
  background:rgba(29,32,35,.76);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.16);border-radius:17px;padding:14px 16px;
  box-shadow:0 12px 35px rgba(0,0,0,.38)}
 .looks:not(.mobile-open),.adjustments:not(.mobile-open){display:none!important}
 .adjustments .panel{display:none}
 .adjustments .panel.mobile-section-active{display:block}
 .adjustments .side-title{position:static;background:transparent;padding:0 0 6px}
 .looks .styles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .looks .style-description{display:block}
 .panel{border:0;padding:6px 0}
 .panel h2{margin-bottom:8px}
 .control{padding:7px 0}
 input[type=range]{min-height:28px}
 .mobile-toolstrip{position:absolute;bottom:0;left:0;right:0;z-index:12;
  display:flex;gap:5px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
  padding:9px 10px calc(10px + env(safe-area-inset-bottom));height:86px;
  background:rgba(23,26,28,.96);border-top:1px solid var(--line)}
 .mobile-toolstrip::-webkit-scrollbar{display:none}
 .mobile-tool{flex:0 0 68px;min-width:68px;background:transparent;color:#d6d8d8;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px;
  border:1px solid transparent;border-radius:12px;font-size:10px;white-space:nowrap}
 .mobile-tool .tool-icon{font-size:21px;line-height:24px;font-weight:400}
 .mobile-tool.selected{background:rgba(217,189,155,.16);border-color:rgba(217,189,155,.55);color:var(--accent)}
 .mobile-tool.compare{color:var(--accent)}
 .mobile-tool.compare.is-held{background:var(--accent);color:#161513}
 .topbar{height:54px}
 .viewer-head{padding:6px 12px}
 .viewer-foot{padding:5px 12px}
 .status{padding:0 12px 5px}
}
@media(min-width:801px){.mobile-toolstrip{display:none}}
</style>

<style id="luma-unified-responsive">
/* One responsive editor: desktop sidebars, mobile floating editing tools. */
@media (min-width:801px) {
  .layout {grid-template-columns:minmax(240px,285px) minmax(0,1fr) minmax(190px,245px)}
  .adjustments,.looks {scrollbar-width:thin}
  .viewer {background:#f6f6f6}
  .image-viewport {background:#fff}
  .image-transform img {box-shadow:0 5px 24px rgba(0,0,0,.13)}
  .topbar {background:#171a1c}
}
@media (max-width:800px) {
  .app {height:100dvh;height:100svh}
  .topbar {padding-top:env(safe-area-inset-top,0px);height:calc(54px + env(safe-area-inset-top,0px))}
  .layout {padding-bottom:env(safe-area-inset-bottom,0px)}
  .mobile-toolstrip {bottom:calc(12px + env(safe-area-inset-bottom,0px))!important}
  .adjustments,.looks {bottom:calc(78px + env(safe-area-inset-bottom,0px))!important}
  .image-viewport {touch-action:none}
}
</style>
<style id="luma-frame-colours">
/* Preview surround only; does not affect exported image pixels. */
.image-viewport{background:#fff!important}
.image-viewport[data-frame="grey"]{background:#858585!important}
.image-viewport[data-frame="black"]{background:#111!important}
.image-viewport{transition:background-color .15s ease}
</style>

<style id="luma-compact-iphone-panels">
@media (max-width:800px) {
  .looks,.adjustments {
    max-height:min(31dvh,265px)!important;
    background:rgba(25,29,32,.48)!important;
    -webkit-backdrop-filter:blur(12px)!important;
    backdrop-filter:blur(12px)!important;
    padding:9px 12px!important;
    border-color:rgba(255,255,255,.22)!important;
    box-shadow:0 5px 20px rgba(0,0,0,.18)!important;
  }
  .adjustments .side-title {font-size:12px!important;padding:0 0 3px!important}
  .adjustments .panel,.looks .panel {padding:2px 0!important}
  .panel h2,.looks h2 {font-size:11px!important;margin-bottom:4px!important}
  .control {padding:2px 0!important}
  .control label {font-size:11px!important;margin-bottom:0!important}
  .control input[type=range] {min-height:24px!important;margin:0!important}
  .looks .styles {gap:5px!important}
  .looks .style-btn {padding:8px 5px!important;font-size:11px!important}
  .looks .style-description {font-size:10px!important;margin-top:6px!important}
  .viewer-foot span {display:none!important}
  .status {font-size:10px!important;min-height:0!important}
}
</style>
</head>
<body><main class="app">
<header class="topbar"><div class="brand">Luma <span class="tag">Film editor</span></div><label class="upload" for="photo">Open photo</label><input id="photo" type="file" accept="image/*,.heic,.heif" hidden><button id="save" type="button">Export JPEG</button></header>
<div class="layout">
<nav class="mobile-toolstrip" aria-label="Photo editing tools">
 <button type="button" class="mobile-tool compare" id="mobileCompare" aria-label="Hold to see original photo"><span class="tool-icon">◐</span><span>Before</span></button>
 <button type="button" class="mobile-tool" data-mobile-panel="looks"><span class="tool-icon">▦</span><span>Looks</span></button>
 <button type="button" class="mobile-tool" data-mobile-panel="0"><span class="tool-icon">◉</span><span>Strength</span></button>
 <button type="button" class="mobile-tool" data-mobile-panel="1"><span class="tool-icon">☼</span><span>Light</span></button>
 <button type="button" class="mobile-tool" data-mobile-panel="2"><span class="tool-icon">◈</span><span>Colour</span></button>
 <button type="button" class="mobile-tool" data-mobile-panel="3"><span class="tool-icon">⌁</span><span>Curves</span></button>
 <button type="button" class="mobile-tool" data-mobile-panel="4"><span class="tool-icon">⁙</span><span>Grain</span></button>
</nav>

<aside class="adjustments"><div class="side-title">Adjustments <button id="reset" class="secondary" type="button">Reset</button></div>
<section class="panel"><h2>Look strength</h2><div class="control"><label for="opacity">Film look opacity <output>100%</output></label><input id="opacity" type="range" min="0" max="100" value="100"></div></section>
<section class="panel"><h2>Light</h2><div class="controls">
<div class="control"><label for="exposure">Exposure <output>.00</output></label><input id="exposure" type="range" min="-100" max="100" value="-1"></div>
<div class="control"><label for="contrast">Contrast <output>+16</output></label><input id="contrast" type="range" min="-100" max="100" value="3"></div>
<div class="control"><label for="highlights">Highlights <output>-18</output></label><input id="highlights" type="range" min="-100" max="100" value="0"></div>
<div class="control"><label for="shadows">Shadows <output>-26</output></label><input id="shadows" type="range" min="-100" max="100" value="-47"></div>
<div class="control"><label for="whites">Whites <output>+12</output></label><input id="whites" type="range" min="-100" max="100" value="0"></div>
<div class="control"><label for="blacks">Blacks <output>-14</output></label><input id="blacks" type="range" min="-100" max="100" value="-7"></div>
</div></section>
<section class="panel"><h2>Colour</h2><div class="controls">
<div class="control"><label for="temperature">Temperature <output>3850 K</output></label><input id="temperature" type="range" min="2000" max="12000" value="6489"></div>
<div class="control"><label for="tint">Tint <output>+62</output></label><input id="tint" type="range" min="-100" max="100" value="58"></div>
<div class="control"><label for="vibrance">Vibrance <output>-1</output></label><input id="vibrance" type="range" min="-100" max="100" value="2"></div>
<div class="control"><label for="saturation">Saturation <output>-2</output></label><input id="saturation" type="range" min="-100" max="100" value="3"></div>
<div class="control"><label for="yellowLum">Yellow luminance <output>0</output></label><input id="yellowLum" type="range" min="-100" max="100" value="5"></div>
</div></section>
<section class="panel"><h2>RGB point-curve adjustments</h2><div class="controls">
<div class="control"><label for="redCurve">Red curve <output>+6</output></label><input id="redCurve" type="range" min="-50" max="50" value="7"></div>
<div class="control"><label for="greenCurve">Green curve <output>-6</output></label><input id="greenCurve" type="range" min="-50" max="50" value="0"></div>
<div class="control"><label for="blueCurve">Blue curve <output>+2</output></label><input id="blueCurve" type="range" min="-50" max="50" value="-8"></div>
</div></section>
<section class="panel"><h2>Grain</h2><div class="controls">
<div class="control"><label for="grain">Amount <output>+18</output></label><input id="grain" type="range" min="0" max="100" value="32"></div>
<div class="control"><label for="grainSize">Size <output>+34</output></label><input id="grainSize" type="range" min="0" max="100" value="37"></div>
<div class="control"><label for="roughness">Roughness <output>+42</output></label><input id="roughness" type="range" min="0" max="100" value="49"></div>
</div></section>

 try{
  if(typeof window.HeicTo!=='function') await loadScript('https://cdn.jsdelivr.net/npm/heic-to@1.6.7/dist/iife/heic-to.js');
  if(typeof window.HeicTo==='function'){
   const jpeg=await window.HeicTo({blob:file,type:'image/jpeg',quality:.96});
   return await createImageBitmap(jpeg);
  }
 }catch(modernError){}
 // Older fallback for unusual HEIF variants.
 try{
  if(typeof window.heic2any!=='function') await loadScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js');
  if(typeof window.heic2any==='function'){
   let jpeg=await window.heic2any({blob:file,toType:'image/jpeg',quality:.96});
   if(Array.isArray(jpeg))jpeg=jpeg[0];
   return await createImageBitmap(jpeg);
  }
 }catch(legacyError){}
 throw Error('This HEIC/HEIF file could not be decoded. Try exporting it as JPEG from Photos, or check that you are online so the HEIC decoder can load.');
}
async function load(file){
 if(!file)return;source=null;status('Loading photo…');
 try{
  let bmp;
  const nm=(file.name||'').toLowerCase(),ty=(file.type||'').toLowerCase();
  const isHeif=ty.includes('heic')||ty.includes('heif')||/\.hei[cf]$/.test(nm);
  if(isHeif){status('Opening iPhone HEIC photo…');bmp=await loadHeif(file);}
  else {bmp=await createImageBitmap(file);}
  fullSource=bmp;filename=(file.name||'photo').replace(/\.[^.]+$/,'');
  const scale=Math.min(1,1400/Math.max(bmp.width,bmp.height)),small=document.createElement('canvas');
  small.width=Math.max(1,Math.round(bmp.width*scale));small.height=Math.max(1,Math.round(bmp.height*scale));
  small.getContext('2d').drawImage(bmp,0,0,small.width,small.height);source=await createImageBitmap(small);
  $('before').src=small.toDataURL('image/jpeg',.9);setZoom(1);labels();render();status('Loaded. Your latest screenshot settings are applied at 100% opacity.');
 }catch(e){status('Could not open photo: '+(e.message||'unsupported format'))}
}

$('photo').addEventListener('change',async e=>{if(e.target.files?.[0])await load(e.target.files[0]);});
controls.forEach(id=>$(id).addEventListener('input',()=>{labels();render()}));

$('save').addEventListener('click',()=>{if(!fullSource)return;status('Rendering full-resolution JPEG…');setTimeout(()=>{const out=document.createElement('canvas');renderTo(out,fullSource);out.toBlob(blob=>{if(!blob){status('Export failed.');return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename+'-luma.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);status('Full-resolution JPEG exported.')},'image/jpeg',.96)},20)});
function applyStyle(name){
 currentStyle=name;
 const preset=presets[name];
 for(const id of controls)$(id).value=preset[id];
 document.querySelectorAll('.style-btn').forEach(b=>{const active=b.dataset.style===name;b.classList.toggle('active',active);b.classList.toggle('secondary',!active)});
 $('styleDescription').textContent=descriptions[name];
 const cap={portra:'FILM LOOK',natural:'A LOOK',bw:'CLASSIC BLACK & WHITE',green:'GREEN VIBE'};
 $('viewLabel').textContent=cap[name];
 labels();render();
}
document.querySelectorAll('.style-btn').forEach(b=>b.addEventListener('click',()=>applyStyle(b.dataset.style)));
$('reset').addEventListener('click',()=>applyStyle('portra'));
labels();

// Zoom, pan, trackpad pinch, and press-and-hold before/after.
const viewport=$('imageViewport'),transform=$('imageTransform');
let zoom=1,panX=0,panY=0,holding=false,dragging=false,moved=false,startX=0,startY=0,originX=0,originY=0,holdTimer=null;
function updateView(){transform.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;viewport.classList.toggle('zoomed',zoom>1.01);$('zoomLabel').textContent=zoom<=1.01?'Fit · hold for original':Math.round(zoom*100)+'% · drag to pan';}
function setZoom(next){zoom=Math.max(1,Math.min(8,next));if(zoom===1){panX=0;panY=0;}updateView();}
function showBefore(){if(!source||holding)return;holding=true;$('after').src=$('before').src;}
function showAfter(){if(!holding)return;holding=false;render();}
viewport.addEventListener('dblclick',e=>{e.preventDefault();setZoom(zoom>1.01?1:2);});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;startX=e.clientX;startY=e.clientY;originX=panX;originY=panY;moved=false;dragging=true;viewport.setPointerCapture(e.pointerId);holdTimer=setTimeout(()=>{if(!moved)showBefore()},180);});
viewport.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.hypot(dx,dy)>7){moved=true;clearTimeout(holdTimer);showAfter();}if(zoom>1&&moved){panX=originX+dx;panY=originY+dy;viewport.classList.add('dragging');updateView();}});
function endPointer(){dragging=false;clearTimeout(holdTimer);viewport.classList.remove('dragging');showAfter();}
viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);viewport.addEventListener('lostpointercapture',endPointer);
viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.012));}},{passive:false});
$('fitButton').addEventListener('click',()=>setZoom(1));$('zoomIn').addEventListener('click',()=>setZoom(zoom*1.5));$('zoomOut').addEventListener('click',()=>setZoom(zoom/1.5));
let pinchDistance=0;
viewport.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);clearTimeout(holdTimer);showAfter();}},{passive:true});
viewport.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchDistance){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setZoom(zoom*d/pinchDistance);pinchDistance=d;}},{passive:true});
viewport.addEventListener('touchend',()=>{pinchDistance=0;});
applyStyle('natural');
$('before').addEventListener('load',async()=>{if(source)return;try{const bmp=await createImageBitmap($('before'));fullSource=bmp;source=bmp;render();}catch(e){}},{once:true});
if($('before').complete)$('before').dispatchEvent(new Event('load'));
</script>
<script>
(function(){
 const layout=document.querySelector('.layout'),adjust=document.querySelector('.adjustments'),looks=document.querySelector('.looks');
 if(!layout||!adjust||!looks)return;
 const bar=document.querySelector('.mobile-toolstrip'),buttons=[...bar.querySelectorAll('[data-mobile-panel]')],sections=[...adjust.querySelectorAll(':scope > .panel')];
 let active=null;
 function close(){active=null;adjust.classList.remove('mobile-open');looks.classList.remove('mobile-open');sections.forEach(p=>p.classList.remove('mobile-section-active'));buttons.forEach(b=>b.classList.remove('selected'));}
 buttons.forEach(btn=>btn.addEventListener('click',()=>{
  const choice=btn.dataset.mobilePanel;if(active===choice){close();return}
  close();active=choice;btn.classList.add('selected');
  if(choice==='looks')looks.classList.add('mobile-open');
  else{adjust.classList.add('mobile-open');sections[Number(choice)]?.classList.add('mobile-section-active')}
 }));
 looks.querySelectorAll('.style-btn').forEach(b=>b.addEventListener('click',()=>{if(matchMedia('(max-width:800px)').matches)close()}));
 const compare=document.getElementById('mobileCompare'),after=document.getElementById('after'),before=document.getElementById('before');
 let held=false;
 function show(e){
  if(e?.pointerType==='mouse'&&e.button!==0)return;
  if(e?.cancelable)e.preventDefault();
  if(held)return;held=true;compare.classList.add('is-held');compare.setAttribute('aria-label','Original photo showing');
  after.src=before.src;
  if(e?.pointerId!=null)try{compare.setPointerCapture(e.pointerId)}catch(_){}
 }
 function hide(){
  if(!held)return;held=false;compare.classList.remove('is-held');compare.setAttribute('aria-label','Hold to see original photo');
  if(typeof render==='function')render();
 }
 compare.addEventListener('pointerdown',show);
 compare.addEventListener('pointerup',hide);
 compare.addEventListener('pointercancel',hide);
 compare.addEventListener('lostpointercapture',hide);
 window.addEventListener('blur',hide);
 compare.addEventListener('contextmenu',e=>e.preventDefault());
 // Keep image visible when iOS browser changes viewport height.
 window.addEventListener('resize',()=>{if(innerWidth>800)close()});
})();
</script>
<script id="luma-frame-switch">
(function(){
 const viewport=document.getElementById('imageViewport');
 if(!viewport)return;
 const colours=['white','grey','black'];
 let selected=0;
 viewport.dataset.frame=colours[selected];
 viewport.title='Right-click to change preview frame: white, grey, black';
 viewport.addEventListener('contextmenu',function(e){
   e.preventDefault();
   selected=(selected+1)%colours.length;
   viewport.dataset.frame=colours[selected];
 });
})();
</script>

<script id="luma-desktop-photo-drop">
(function(){
 const viewport=document.getElementById('imageViewport');
 const input=document.getElementById('photo');
 if(!viewport||!input)return;
 let depth=0;
 const desktop=()=>window.matchMedia('(min-width:801px)').matches;
 const hasFiles=e=>Array.from(e.dataTransfer?.types||[]).includes('Files');
 function clear(){depth=0;viewport.classList.remove('luma-drop-ready')}
 document.addEventListener('dragenter',e=>{
   if(!desktop()||!hasFiles(e))return;
   e.preventDefault();depth++;viewport.classList.add('luma-drop-ready');
 });
 document.addEventListener('dragover',e=>{
   if(!desktop()||!hasFiles(e))return;
   e.preventDefault();e.dataTransfer.dropEffect='copy';
 });
 document.addEventListener('dragleave',e=>{
   if(!desktop()||!hasFiles(e))return;
   if(--depth<=0)clear();
 });
 document.addEventListener('drop',async e=>{
   if(!desktop()||!hasFiles(e))return;
   e.preventDefault();clear();
   const files=Array.from(e.dataTransfer.files||[]);
   const file=files.find(f=>f.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp|avif|tiff?)$/i.test(f.name));
   if(!file){
     if(typeof status==='function')status('No photo was received. Try dragging a photo from Photos, or export it to Finder first.');
     return;
   }
   // Use the same loader as Open photo, including its HEIC conversion.
   if(typeof load==='function')await load(file);
 });
 window.addEventListener('blur',clear);
})();
</script>
